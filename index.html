      box.innerHTML = `<span class="text-indigo-400 animate-pulse">// Synthesizing executive appraisal for ${name}...</span>`;
      setTimeout(() => {
        const text = `[EXECUTIVE APPRAISAL REPORT]\nSubject: ${name} | Tier: ${rating}\n\n1. EXECUTIVE SUMMARY:\nDemonstrated exceptional architectural ownership and cloud migration execution across multi-region infrastructure.\n\n2. STAR ALIGNMENT:\n• Situation: Stringent zero-downtime requirements during complex infrastructure overhaul.\n• Task: Migrate legacy services to Kubernetes securely.\n• Action: Spearheaded containerization strategy and cross-functional team enablement.\n• Result: Achieved 100% uptime and elevated junior dev productivity.`;
        box.innerText = text;
        document.getElementById('copilotWordCount').innerText = text.split(/\s+/).length;
      }, 500);
    }

    function copyCopilotOutput() {
      navigator.clipboard.writeText(document.getElementById('copilotOutput').innerText);
      alert('Copied to clipboard!');
    }

    function downloadCopilotTxt() {
      const text = document.getElementById('copilotOutput').innerText;
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'copilot_review.txt';
      a.click();
    }

    function initCopilotCharts() {
      try {
        const ctxR = document.getElementById('copilotRadar');
        if(ctxR && !ctxR.chart) {
          ctxR.chart = new Chart(ctxR, {
            type: 'radar',
            data: {
              labels: ['Delivery', 'Ownership', 'Collaboration', 'Mentorship'],
              datasets: [{ data: [4, 5, 3, 5], backgroundColor: 'rgba(99, 102, 241, 0.2)', borderColor: '#6366f1' }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { r: { ticks: { display: false }, grid: { color: '#334155' } } } }
          });
        }
        const ctxB = document.getElementById('copilotBar');
        if(ctxB && !ctxB.chart) {
          ctxB.chart = new Chart(ctxB, {
            type: 'bar',
            data: {
              labels: ['Backend', 'Frontend', 'DevOps', 'AI/ML'],
              datasets: [{ data: [4.2, 3.9, 4.5, 4.7], backgroundColor: '#6366f1', borderRadius: 6 }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' }, max: 5 } } }
          });
        }
      } catch(e) {}
    }

    function runModerationTest() {
      const text = document.getElementById('sampleText').value.toLowerCase();
      const res = document.getElementById('scanResult');
      res.style.display = 'block';
      if(text.includes('spam') || text.includes('abuse')) {
        res.innerHTML = '<strong style="color:#fca5a5;">❌ Flagged: Restricted terms detected.</strong>';
      } else {
        res.innerHTML = '<strong style="color:#86efac;">✅ Clean Content: No violations.</strong>';
      }
    }

    document.addEventListener('DOMContentLoaded', () => showPage('home'));
  </script>

</body>
</html>
